version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: scout_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scout_db}
      POSTGRES_USER: ${POSTGRES_USER:-scout_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scout_prod_pass_2026}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scout_admin} -d ${POSTGRES_DB:-scout_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: scout_redis_prod
    restart: always
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: scout_backend_prod
    restart: always
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - backup_volume:/app/backups
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: scout_celery_worker_prod
    restart: always
    command: celery -A config worker -l info --concurrency=2
    volumes:
      - media_volume:/app/media
      - backup_volume:/app/backups
    env_file:
      - .env
    depends_on:
      - backend
      - redis

  celery_beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: scout_celery_beat_prod
    restart: always
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    depends_on:
      - backend
      - redis

  nginx:
    image: nginx:1.25-alpine
    container_name: scout_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend

volumes:
  postgres_data_prod:
  redis_data_prod:
  static_volume:
  media_volume:
  backup_volume:
